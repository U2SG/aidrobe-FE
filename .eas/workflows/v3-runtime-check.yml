name: V3 runtime compatibility checks
# Manual only; no push trigger, native build, deployment or secret mutation.
defaults:
  tools:
    node: '24.14.0'
    pnpm: '10.33.3'
jobs:
  verify:
    name: SDK 57 compatibility
    environment: preview
    runs_on: linux-medium
    steps:
      - uses: eas/checkout
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check SDK dependency compatibility
        run: pnpm exec expo install --check
      - name: Expo Doctor
        run: npx --yes expo-doctor@latest
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Regression tests
        run: pnpm test
