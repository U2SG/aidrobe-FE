document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0h11v-9.5M10 20v-5h4v5\" stroke=\"{{ todayColor }}\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span style=\"font:500 10px system-ui;color:{{ todayColor }}\">今日<\u002Fspan><\u002Fdiv>\n        <div onclick=\"{{ tabWardrobe }}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:6px;cursor:pointer\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\"><rect x=\"5\" y=\"4\" width=\"14\" height=\"16\" rx=\"2.5\" stroke=\"{{ wardrobeColor }}\" stroke-width=\"1.8\"><\u002Frect><path d=\"M12 4v16M9 11v2M15 11v2\" stroke=\"{{ wardrobeColor }}\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><span style=\"font:500 10px system-ui;color:{{ wardrobeColor }}\">衣橱<\u002Fspan><\u002Fdiv>\n        <div onclick=\"{{ tabDiscover }}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:6px;cursor:pointer\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\"><circle cx=\"12\" cy=\"12\" r=\"8\" stroke=\"{{ discoverColor }}\" stroke-width=\"1.8\"><\u002Fcircle><path d=\"m14.5 9.5-1.2 3.8L9.5 14.5l1.2-3.8 3.8-1.2Z\" stroke=\"{{ discoverColor }}\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span style=\"font:600 10px system-ui;color:{{ discoverColor }}\">发现<\u002Fspan><\u002Fdiv>\n        <div onclick=\"{{ tabProfile }}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:6px;cursor:pointer\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\"><circle cx=\"12\" cy=\"8\" r=\"3.2\" stroke=\"{{ profileColor }}\" stroke-width=\"1.8\"><\u002Fcircle><path d=\"M5.5 20c1.1-3.5 3.2-5.2 6.5-5.2s5.4 1.7 6.5 5.2\" stroke=\"{{ profileColor }}\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><span style=\"font:500 10px system-ui;color:{{ profileColor }}\">我的<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ============ MODALS ============ -->\n      <sc-if value=\"{{ anyModal }}\" hint-placeholder-val=\"{{ false }}\">\n        <div onclick=\"{{ closeModal }}\" style=\"position:absolute;inset:0;background:rgba(26,23,20,0.45);z-index:40;animation:fadeIn 0.2s ease\"><\u002Fdiv>\n      <\u002Fsc-if>\n<sc-if value=\"{{ modalCreatePacking }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;left:0;right:0;bottom:0;height:480px;background:#FAF7F0;border-radius:28px 28px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,0.25);z-index:41;overflow:hidden;animation:sheetUp 0.3s cubic-bezier(0.16,1,0.3,1)\">\n          <div style=\"width:38px;height:5px;border-radius:3px;background:#D8D0C2;margin:10px auto 0\"><\u002Fdiv>\n          <div style=\"padding:14px 20px 0\"><div style=\"font:700 19px system-ui;color:#1A1714;letter-spacing:-0.3px\">新建打包清单<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding:18px 20px 0;display:flex;flex-direction:column;gap:16px\">\n            <div><div style=\"font:500 12px system-ui;color:#7A736A;margin-bottom:7px\">目的地（可选）<\u002Fdiv><div style=\"background:#FFFFFF;border:1px solid #EFE8DC;border-radius:14px;padding:13px 15px\"><span style=\"font:400 14px system-ui;color:#1A1714\">东京<\u002Fspan><\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font:500 12px system-ui;color:#7A736A;margin-bottom:7px\">天数<\u002Fdiv><div style=\"display:flex;align-items:center;justify-content:space-between;background:#FFFFFF;border:1px solid #EFE8DC;border-radius:14px;padding:9px 14px\"><div style=\"width:32px;height:32px;border-radius:10px;background:#F1ECE2;display:flex;align-items:center;justify-content:center\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 12h14\" stroke=\"#3F3A33\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><span style=\"font:700 18px system-ui;color:#1A1714\">5 天<\u002Fspan><div style=\"width:32px;height:32px;border-radius:10px;background:#1A1714;display:flex;align-items:center;justify-content:center\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 5v14M5 12h14\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font:500 12px system-ui;color:#7A736A;margin-bottom:8px\">场景（多选）<\u002Fdiv><div style=\"display:flex;flex-wrap:wrap;gap:8px\"><span style=\"background:#F4E8D1;color:#3F3A33;font:500 13px system-ui;padding:8px 14px;border-radius:999px\">通勤<\u002Fspan><span style=\"background:#1A1714;color:#fff;font:600 13px system-ui;padding:8px 14px;border-radius:999px\">商务<\u002Fspan><span style=\"background:#1A1714;color:#fff;font:600 13px system-ui;padding:8px 14px;border-radius:999px\">休闲<\u002Fspan><span style=\"background:#F4E8D1;color:#3F3A33;font:500 13px system-ui;padding:8px 14px;border-radius:999px\">约会<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:absolute;left:0;right:0;bottom:0;padding:14px 20px 22px;background:linear-gradient(to top,#FAF7F0 70%,rgba(250,247,240,0))\"><div onclick=\"{{ closeModal }}\" style=\"height:50px;background:#1A1714;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3.5 13.8 9l5.2 3-5.2 3L12 20.5 10.2 15 5 12l5.2-3L12 3.5Z\" stroke=\"#fff\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><span style=\"font:700 15px system-ui;color:#fff\">生成清单<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ modalAddInspo }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;left:0;right:0;bottom:0;height:440px;background:#FAF7F0;border-radius:28px 28px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,0.25);z-index:41;overflow:hidden;animation:sheetUp 0.3s cubic-bezier(0.16,1,0.3,1)\">\n          <div style=\"width:38px;height:5px;border-radius:3px;background:#D8D0C2;margin:10px auto 0\"><\u002Fdiv>\n          <div style=\"padding:14px 20px 0\"><div style=\"font:700 19px system-ui;color:#1A1714;letter-spacing:-0.3px\">添加灵感<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;background:#F1ECE2;border-radius:999px;padding:4px;margin:16px 20px 0\"><div style=\"flex:1;text-align:center;background:#fff;border-radius:999px;padding:8px 0;box-shadow:0 1px 3px rgba(60,40,20,0.08)\"><span style=\"font:600 12px system-ui;color:#1A1714\">链接 / 图片<\u002Fspan><\u002Fdiv><div style=\"flex:1;text-align:center;padding:8px 0\"><span style=\"font:500 12px system-ui;color:#7A736A\">批量<\u002Fspan><\u002Fdiv><div style=\"flex:1;text-align:center;padding:8px 0\"><span style=\"font:500 12px system-ui;color:#7A736A\">PDF 杂志<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div style=\"padding:18px 20px 0\">\n            <div style=\"background:#FFFFFF;border:1px solid #EFE8DC;border-radius:14px;padding:13px 15px\"><span style=\"font:400 14px system-ui;color:#A7A09A\">粘贴图片或链接…<\u002Fspan><\u002Fdiv>\n            <div style=\"border:1.6px dashed #D8D0C2;border-radius:18px;padding:24px 20px;text-align:center;margin-top:14px\"><div style=\"width:42px;height:42px;border-radius:14px;background:#F4E8D1;display:flex;align-items:center;justify-content:center;margin:0 auto\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 16V5M8 9l4-4 4 4M5 19h14\" stroke=\"#B08D5B\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font:600 14px system-ui;color:#1A1714;margin-top:10px\">从相册选择<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:absolute;left:0;right:0;bottom:0;padding:14px 20px 22px;background:linear-gradient(to top,#FAF7F0 70%,rgba(250,247,240,0))\"><div onclick=\"{{ closeModal }}\" style=\"height:50px;background:#1A1714;border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:pointer\"><span style=\"font:700 15px system-ui;color:#fff\">添加到灵感库<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <!-- MODAL_END -->\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    tab: 'discover',\n    stack: [],\n    modal: null,\n    packChecked: { '1-0': true },\n    askMsgs: [],\n  };\n\n  askRef = React.createRef();\n\n  top() {\n    const s = this.state.stack;\n    return s.length ? s[s.length - 1] : null;\n  }\n\n  push(id) { this.setState((st) => ({ stack: [...st.stack, id] })); }\n  setTab(t) { this.setState({ tab: t, stack: [], modal: null }); }\n  send(text) {\n    if (!text || !text.trim()) return;\n    const ai = {\n      isUser: false, isAi: true,\n      text: '推荐象牙白衬衫配米色西裤，外搭燕麦色针织开衫——低饱和、安静利落，脚下小白鞋收尾。',\n      refs: ['衬衫', '针织', '西裤'],\n    };\n    this.setState((st) => ({ askMsgs: [...st.askMsgs, { isUser: true, isAi: false, text, refs: [] }, ai] }));\n  }\n\n  renderVals() {\n    const top = this.top();\n    const atRoot = this.state.stack.length === 0;\n    const tab = this.state.tab;\n    const ACT = '#1A1714', IN = '#A7A09A';\n\n    const packItems = [\n      { id: '1-0', day: 'Day 1 · 抵达', name: '燕麦色针织衫', scene: '休闲 · 机场舒适', kind: '针织' },\n      { id: '1-1', day: 'Day 1 · 抵达', name: '直筒牛仔裤', scene: '休闲', kind: '牛仔' },\n      { id: '2-0', day: 'Day 2 · 商务会议', name: '藏青西装外套', scene: '商务', kind: '西装' },\n      { id: '2-1', day: 'Day 2 · 商务会议', name: '棕色乐福鞋', scene: '商务 · 百搭', kind: '乐福鞋' },\n    ];\n    const days = [];\n    packItems.forEach((it) => {\n      let g = days.find((d) => d.day === it.day);\n      if (!g) { g = { day: it.day, items: [] }; days.push(g); }\n      const checked = !!this.state.packChecked[it.id];\n      g.items.push({\n        ...it, checked,\n        boxStyle: checked\n          ? { width: 22, height: 22, borderRadius: 7, background: '#3F8060', flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }\n          : { width: 22, height: 22, borderRadius: 7, border: '1.6px solid #D8D0C2', flexShrink: 0, cursor: 'pointer' },\n        nameStyle: checked\n          ? { font: '600 13px system-ui', color: '#A7A09A', textDecoration: 'line-through' }\n          : { font: '600 13px system-ui', color: '#1A1714' },\n        toggle: () => this.setState((st) => ({ packChecked: { ...st.packChecked, [it.id]: !st.packChecked[it.id] } })),\n      });\n    });\n    const checkedCount = packItems.filter((it) => this.state.packChecked[it.id]).length;\n\n    return {\n      showDiscover: atRoot && tab === 'discover',\n      showToday: atRoot && tab === 'today',\n      showWardrobe: atRoot && tab === 'wardrobe',\n      showProfile: atRoot && tab === 'profile',\n      showInsights: top === 'insights',\n      showReport: top === 'report',\n      showPacking: top === 'packing',\n      showPackingDetail: top === 'packingDetail',\n      showAsk: top === 'ask',\n      showSense: top === 'sense',\n      showSenseResult: top === 'senseResult',\n      showInspo: top === 'inspo',\n\n      todayColor: tab === 'today' && atRoot ? ACT : IN,\n      wardrobeColor: tab === 'wardrobe' && atRoot ? ACT : IN,\n      discoverColor: tab === 'discover' ? ACT : IN,\n      profileColor: tab === 'profile' && atRoot ? ACT : IN,\n\n      goInsights: () => this.push('insights'),\n      goReport: () => this.push('report'),\n      goPacking: () => this.push('packing'),\n      goPackingDetail: () => this.push('packingDetail'),\n      goAsk: () => this.push('ask'),\n      goSense: () => this.push('sense'),\n      goSenseResult: () => this.push('senseResult'),\n      goInspo: () => this.push('inspo'),\n      back: () => this.setState((st) => ({ stack: st.stack.slice(0, -1) })),\n      tabToday: () => this.setTab('today'),\n      tabWardrobe: () => this.setTab('wardrobe'),\n      tabDiscover: () => this.setTab('discover'),\n      tabProfile: () => this.setTab('profile'),\n\n      anyModal: !!this.state.modal,\n      modalCreatePacking: this.state.modal === 'createPacking',\n      modalAddInspo: this.state.modal === 'addInspo',\n      openCreatePacking: () => this.setState({ modal: 'createPacking' }),\n      openAddInspo: () => this.setState({ modal: 'addInspo' }),\n      closeModal: () => this.setState({ modal: null }),\n\n      packDays: days,\n      packCheckedLabel: checkedCount + '/' + packItems.length,\n      packProgress: Math.round((checkedCount / packItems.length) * 100) + '%',\n\n      askMsgs: this.state.askMsgs,\n      hasAsk: this.state.askMsgs.length > 0,\n      askRef: this.askRef,\n      sendAsk: () => { const v = this.askRef.current ? this.askRef.current.value : ''; if (this.askRef.current) this.askRef.current.value = ''; this.send(v); },\n      askSuggest1: () => this.send('明天通勤穿什么？想低调一点'),\n      askSuggest2: () => this.send('这件藏青西装配什么鞋？'),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
