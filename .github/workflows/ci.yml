name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          # Node 24 so the regression scripts (scripts/*.test.ts) run directly
          # via built-in TypeScript type-stripping (no jest/ts-node stack).
          node-version: 24
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
